[project]
name = "factpack"
version = "0.1.0"
description = "Capital One public grounding corpus - pipeline and retrieval layer"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "rich>=13",
    "typer>=0.12",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "sqlite-vec>=0.1.6",
    "numpy>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
factpack = "factpack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factpack"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
