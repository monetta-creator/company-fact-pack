<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Pack</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .askbar { display:flex; gap:10px; align-items:center; margin:0 0 26px; }
  .askbar input[type=text] { flex:1; }
  .deep { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--secondary);
          white-space:nowrap; }
  #answer { white-space:pre-wrap; font-size:16px; line-height:1.6; }
  .flag { border-left:3px solid var(--bad); padding:8px 14px; margin:8px 0;
          font-size:13.5px; background:color-mix(in srgb, var(--bad) 6%, transparent);
          border-radius:0 8px 8px 0; }
  .verifyline { font-size:13.5px; margin-top:16px; }
  #peek { position:fixed; top:0; right:-420px; width:400px; height:100vh;
          background:var(--surface); border-left:1px solid var(--hairline);
          transition:right .22s ease; padding:22px; overflow-y:auto; z-index:20; }
  #peek.open { right:0; }
  #peek h3 { margin:0 0 2px; font-size:13px; color:var(--accent);
             font-family:"SF Mono", ui-monospace, monospace; }
  #peek .src { color:var(--secondary); font-size:12px; margin-bottom:12px; }
  #peek pre { white-space:pre-wrap; }
  #peek .close { float:right; cursor:pointer; color:var(--secondary); font-size:17px; }
  @media (prefers-reduced-motion:reduce) { #peek { transition:none; } }
</style>
</head>
<body>
<nav><div class="inner">
  <a class="brand" href="/">Fact Pack</a>
  <a href="/" class="active">Ask</a><a href="/update">Update</a><a href="/howto">How&nbsp;to</a>
  <a href="/architecture">Architecture</a><a href="/about">About</a>
</div></nav>
<main>
  <h1>Ask.</h1>
  <p class="sub">Every answer cites public sources. Every number is checked.</p>
  <form class="askbar" id="f">
    <input type="text" id="q" placeholder="How did trust charge-off rates trend through 2025?" autofocus>
    <label class="deep"><input type="checkbox" id="deep" style="width:auto">Deep</label>
    <button>Ask</button>
  </form>
  <div id="out"></div>
</main>
<div id="peek"><span class="close" onclick="peek.classList.remove('open')">✕</span><div id="peekbody"></div></div>
<script>
const out = document.getElementById('out');
const peek = document.getElementById('peek');
const peekbody = document.getElementById('peekbody');
let tags = {}, lastMeta = {};

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  out.innerHTML = '<div class="card dim">Retrieving, drafting, verifying…</div>';
  const res = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question:q, deep:document.getElementById('deep').checked, tags})});
  const d = await res.json();
  tags = d.tags || tags; lastMeta = d.citation_meta || {};
  render(d);
});

function render(d) {
  let html = esc(d.answer).replace(/\[((?:C\d+)|(?:(?:ent|obs|ev|brief):[A-Za-z0-9._-]+))\]/g,
    (m, t) => `<span class="chip" onclick="openPeek('${t}')">${t}</span>`);
  let b = `<div class="card"><div id="answer">${html}</div><div class="verifyline">`;
  if (d.verify.flags.length) {
    b += d.verify.flags.map(f => `<div class="flag"><b>${f.kind}</b> ${esc(f.excerpt||'')} — ${esc(f.issue)}</div>`).join('');
  } else {
    b += `<span class="ok">Verified</span><span class="dim"> · ${d.verify.numbers_checked} figures · ${d.verify.model_checked} claims · ${d.citations.length} citations</span>`;
  }
  if (d.audit.length) b += `<div class="dim" style="margin-top:6px;font-size:13px">Unprovable citations removed: ${d.audit.join(', ')}</div>`;
  b += `</div></div>`;
  out.innerHTML = b;
}

async function openPeek(tok) {
  const m = lastMeta[tok] || {};
  peekbody.innerHTML = `<h3>${tok}</h3><div class="src">${esc(m.label||'')}</div>`;
  peek.classList.add('open');
  if (m.kind === 'obs') { peekbody.innerHTML += `<pre>Governed observation\nSource: ${esc(m.doc_id||'')}</pre>`; return; }
  const url = m.kind === 'chunk' ? `/api/peek/chunk/${m.chunk_id}`
            : m.kind ? `/api/peek/${m.kind}/${m.id}` : null;
  if (!url) return;
  const d = await (await fetch(url)).json();
  const src = d.doc_id ? `${d.doc_id} §${d.section_id||''}` : (d.title || '');
  peekbody.innerHTML += `<div class="src">${esc(src)}</div><pre>${esc(d.preamble ? d.preamble+'\n\n'+d.text : JSON.stringify(d,null,1))}</pre>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
