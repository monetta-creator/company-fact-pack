# Golden retrieval set (D11): the only instrument that can see index-time failures.
# Expectations are doc-id prefixes and/or must_contain spans — never chunk_ids
# (content-addressed, shift across rebuilds). Scored by evals/run_retrieval.py.

# --- 10-K narrative ---
- query: Capital One credit risk factors competition regulation
  expect_doc_prefix: edgar-cof/10-K
- query: management discussion analysis credit card segment results
  expect_doc_prefix: edgar-cof/10-K
- query: allowance for credit losses methodology CECL
  expect_doc_prefix: edgar-cof/10-K
- query: Capital One business overview principal segments
  expect_doc_prefix: edgar-cof/10-K
- query: liquidity funding sources deposits securitization
  expect_doc_prefix: edgar-cof/10-K
- query: interest rate risk management hedging
  expect_doc_prefix: edgar-cof/
- query: cybersecurity incident 2019 unauthorized access individual
  expect_doc_prefix: edgar-cof/
  must_contain: unauthorized
- query: Discover Financial Services risk factors student loans
  expect_doc_prefix: edgar-dfs/10-K
- query: Discover payment services network segment PULSE Diners Club
  expect_doc_prefix: edgar-dfs/
  must_contain: PULSE

# --- quarterly / results ---
- query: quarterly net interest margin trends provision
